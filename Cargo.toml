[package]
name = "cargo-dominic"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.34"
lol_html = "3.0.1"
simple_logger = "5.2.0"
clap = { version = "4.6.7", features = ["derive"] }
toml_edit = "0.25.17"
syn = { version = "3.0.6", features = ["full"] }
quote = "1.0.47"
fastrand = "2.5.0"
walkdir = "2.5.0"
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "tokio",
] }
notify = "8.2.0"
tokio = { version = "1.53.2", features = [
    "rt",
    "net",
    "sync",
    "time",
    "macros",
] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
